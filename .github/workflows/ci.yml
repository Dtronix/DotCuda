name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  TESTINGPLATFORM_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Builds the committed generated bindings; CUDA is not needed to compile them.
      - name: Build
        run: dotnet build DotCuda.slnx -c Release

      # Runners have no GPU or CUDA: layout tests run everywhere, the MSVC comparison and GPU smoke tests skip with a
      # reason. Exit code 8 ("zero tests ran") is accepted for the case where every test in a project skips.
      - name: ABI tests
        run: dotnet run --project tests/DotCuda.AbiTests -c Release --no-build -- --output Detailed --ignore-exit-code 8

      - name: Smoke tests (JIT)
        run: dotnet run --project tests/DotCuda.SmokeTests -c Release --no-build -- --output Detailed --ignore-exit-code 8

      - name: NativeAOT prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      # Publishing with trim/AOT analysis as errors checks AOT compatibility; running the native executable checks the
      # library resolver and LibraryImport stubs under NativeAOT.
      - name: Smoke tests (NativeAOT)
        shell: bash
        run: |
          dotnet publish tests/DotCuda.SmokeTests -c Release -r ${{ matrix.rid }} -p:PublishAot=true -o artifacts/aot-smoke
          ./artifacts/aot-smoke/DotCuda.SmokeTests --output Detailed --ignore-exit-code 8

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Check the tag matches the project version
        shell: bash
        run: |
          version=$(dotnet msbuild src/DotCuda.Core/DotCuda.Core.csproj -getProperty:Version)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the project version $version (Directory.Build.props)."
            exit 1
          fi

      - name: Pack
        run: dotnet pack DotCuda.slnx -c Release -o artifacts/packages

      # Packages are attached to the GitHub release only; nothing is pushed to NuGet.
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" artifacts/packages/*.nupkg \
            --title "DotCuda $GITHUB_REF_NAME" --generate-notes --verify-tag $prerelease
